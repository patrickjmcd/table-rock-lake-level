name: ci

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Builds and previews come from Vercel.
jobs:
  release:
    uses: patrickjmcd/workflows/.github/workflows/release-please.yml@v1
    with:
      release-type: node
    secrets:
      token: ${{ secrets.PAT }}
